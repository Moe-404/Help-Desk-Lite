name: Build and deploy Vite React app to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x' # pin to Node 20 for consistent build environment

      - name: Node & npm info (diagnostic)
        run: |
          echo "=== node / npm info ==="
          node --version
          npm --version
          echo
          echo "=== package.json ==="
          cat package.json || true
          echo
          echo "=== repo listing (root) ==="
          ls -la
          echo
          echo "=== node_modules? (if any) ==="
          ls -la node_modules || true

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: NODE_OPTIONS=--trace-warnings npm run build

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          token: ${{ secrets.GITHUB_TOKEN }}
